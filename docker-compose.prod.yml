version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: erp_imperio_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-erp_imperio}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: erp_imperio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_network

  minio:
    image: minio/minio
    container_name: erp_imperio_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - erp_network

  backend:
    build:
      context: ./backend
    container_name: erp_imperio_backend
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3002,http://localhost
    ports:
      - "3001:3000" # Exposing on 3001 locally, or use Nginx
    depends_on:
      - db
      - redis
      - minio
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
    container_name: erp_imperio_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks:
      - erp_network

  nginx:
    image: nginx:alpine
    container_name: erp_imperio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erp_network

  prometheus:
    image: prom/prometheus:latest
    container_name: erp_imperio_prometheus
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - erp_network

  grafana:
    image: grafana/grafana:latest
    container_name: erp_imperio_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - erp_network

volumes:
  db_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  erp_network:
    driver: bridge
