version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: imperio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperio_network

volumes:
  redis_data:

networks:
  imperio_network:
    driver: bridge
