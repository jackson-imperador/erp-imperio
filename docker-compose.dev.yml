version: '3.9'

# ============================================================
# IMPÉRIO ERP — Docker Compose (Development)
# Starts all infrastructure services for local development
# ============================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: imperio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imperio
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: imperio_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperio -d imperio_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperio_network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: imperio_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperio_network

  # ── MinIO (Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: imperio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imperio_network

  # ── MailHog (Dev Email Catcher) ────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: imperio_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - imperio_network

  # ── PgAdmin (Database UI) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: imperio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@imperio.erp
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - imperio_network

# ── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:

# ── Networks ───────────────────────────────────────────────
networks:
  imperio_network:
    driver: bridge
