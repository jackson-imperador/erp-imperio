apiVersion: apps/v1
kind: Deployment
metadata:
  name: imperio-erp-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: imperio-erp-api
  template:
    metadata:
      labels:
        app: imperio-erp-api
    spec:
      containers:
      - name: api
        image: imperio-erp-api:latest
        ports:
        - containerPort: 4000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 4000
        livenessProbe:
          httpGet:
            path: /health/live
            port: 4000
